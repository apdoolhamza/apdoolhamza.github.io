<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Exam Prep Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF1F6;--s:#fff;--s2:#F4F6F9;--ink:#0F1A2B;--mut:#5B6B80;--line:#DCE3EB;--c1:#0B7A50;--c1s:#E0F4EA;--c2:#4A3FD4;--c2s:#E9E7FB;--ok:#12915B;--oks:#DFF5E9;--no:#D63A4A;--nos:#FCE6E8;--sh:0 10px 40px rgba(15,26,43,.10);--on:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1017;--s:#151C26;--s2:#1B2430;--ink:#E8EEF5;--mut:#93A1B3;--line:#263140;--c1:#2FBF86;--c1s:#13291F;--c2:#8E86FF;--c2s:#1E1D40;--ok:#35C98A;--oks:#12281F;--no:#FF6B79;--nos:#33161B;--sh:0 10px 40px rgba(0,0,0,.5);--on:#07130D}}
:root[data-theme="dark"]{--bg:#0B1017;--s:#151C26;--s2:#1B2430;--ink:#E8EEF5;--mut:#93A1B3;--line:#263140;--c1:#2FBF86;--c1s:#13291F;--c2:#8E86FF;--c2s:#1E1D40;--ok:#35C98A;--oks:#12281F;--no:#FF6B79;--nos:#33161B;--sh:0 10px 40px rgba(0,0,0,.5);--on:#07130D}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--ac,var(--c1));outline-offset:2px}
h1,h2,h3,p{margin:0}
[data-c="npc"]{--ac:var(--c1);--acs:var(--c1s)}
[data-c="phil"]{--ac:var(--c2);--acs:var(--c2s)}
#app{width:100%;max-width:680px;height:100%;display:flex;flex-direction:column;background:radial-gradient(120% 55% at 0% 0%,color-mix(in srgb,var(--c1) 18%,transparent),transparent 60%),radial-gradient(100% 50% at 100% 0%,color-mix(in srgb,var(--c2) 15%,transparent),transparent 55%),var(--bg);position:relative;overflow:hidden}
@media(min-width:720px){body{padding:20px 0;align-items:center}#app{height:min(100%,920px);border-radius:30px;box-shadow:var(--sh);border:1px solid var(--line)}}
#view{flex:1;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;min-height:0}
.pad{padding:16px 18px 28px}
.top{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 6px}
.top h1{font-size:34px;font-weight:800;letter-spacing:-.035em}
.top p{color:var(--mut);font-size:14px;margin-top:2px}
.ib{width:44px;height:44px;border-radius:14px;background:var(--s);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.ib svg{width:22px;height:22px}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;margin:6px 18px 14px;padding:6px;gap:6px;background:color-mix(in srgb,var(--s) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;box-shadow:var(--sh);flex:none}
.tabs.hide{display:none}
.tabs button{flex:1;padding:13px 0;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700;color:var(--mut);border-radius:20px;transition:background .2s,color .2s}
.tabs button svg{width:20px;height:20px}
.tabs button.on{background:var(--c1s);color:var(--c1)}
:root[data-theme="dark"] .tabs button.on{color:var(--c1)}
.cont{background:var(--ink);color:var(--bg);border-radius:22px;padding:16px 18px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-bottom:18px}
.cont b{display:block;font-size:16px}.cont small{opacity:.75;font-size:13px}
.cont .go{margin-left:auto;background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px}
.course{background:var(--s);border:1px solid var(--line);border-radius:32px;padding:12px;margin-bottom:20px;box-shadow:0 14px 34px -16px rgba(15,26,43,.25)}
.chead{display:flex;align-items:center;gap:14px;background:radial-gradient(90% 150% at 100% 0%,rgba(255,255,255,.3),transparent 60%),var(--ac);color:var(--on);border-radius:24px;padding:20px 18px;margin-bottom:8px}
:root:not([data-theme="dark"]) .chead{color:#fff}
.chead .cic{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.chead .cic svg{width:26px;height:26px}
.chead h2{font-size:18px;font-weight:800;line-height:1.2;letter-spacing:-.01em}
.chead p{font-size:13px;opacity:.85;margin-top:3px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 10px;border-radius:16px;transition:background .15s}
.row+.row{border-top:1px solid var(--line);border-radius:0}
.row:active{background:var(--s2)}
.row .tx{flex:1;min-width:0}
.row b{display:block;font-size:16px;font-weight:700}
.row small{display:block;color:var(--mut);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ri{width:40px;height:40px;border-radius:12px;background:var(--acs);color:var(--ac);display:grid;place-items:center;flex:none}
.row .ri svg{width:20px;height:20px}
.chip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--acs);color:var(--ac);white-space:nowrap}
.chev{width:18px;height:18px;color:var(--mut);flex:none}
.sheetbg{position:absolute;inset:0;background:rgba(8,14,22,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:flex-end;z-index:20;animation:fade .2s}
.sheet{background:var(--s);width:100%;max-height:88%;overflow:auto;border-radius:34px 34px 0 0;padding:10px 20px 24px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:21px;font-weight:800;letter-spacing:-.01em}
.sheet .sub{color:var(--mut);font-size:14px;margin:4px 0 16px}
.seg{display:flex;background:var(--s2);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;padding:12px 6px;border-radius:12px;font-weight:700;font-size:15px;color:var(--mut)}
.seg button.on{background:var(--s);color:var(--ac);box-shadow:0 2px 10px rgba(15,26,43,.12)}
.hint{font-size:13px;color:var(--mut);margin:10px 2px 16px;line-height:1.45}
.lbl{font-size:14px;font-weight:700;margin:14px 0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{padding:10px 16px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;font-size:14px}
.chips button.on{border-color:var(--ac);background:var(--acs);color:var(--ac)}
.sw{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;font-weight:600;font-size:15px;width:100%}
.sw i{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on i{background:var(--ac)}.sw.on i::after{transform:translateX(18px)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:58px;padding:0 22px;border-radius:22px;font-weight:700;font-size:16px;width:100%}
.btn.pri{background:var(--ac,var(--c1));color:var(--on)}
:root:not([data-theme="dark"]) .btn.pri{color:#fff}
.btn.ghost{background:var(--s2);color:var(--ink)}
.btn.danger{background:var(--nos);color:var(--no)}
.btn:disabled{opacity:.4;cursor:default}
.btn:active:not(:disabled){transform:scale(.98)}
.btns{display:flex;gap:10px;margin-top:18px}
.qtop{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}
.qmeta{flex:1;min-width:0}
.qmeta b{font-size:20px;font-weight:800}.qmeta b span{color:var(--mut);font-weight:600;font-size:15px}
.qmeta small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;background:var(--s);border:1px solid var(--line);padding:8px 12px;border-radius:12px}
.timer.low{color:var(--no);border-color:var(--no)}
.bar{height:9px;background:var(--line);margin:0 16px;border-radius:9px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .3s}
.qbody{flex:1;overflow-y:auto;padding:22px 18px 16px;min-height:0}
.qt{font-size:23px;font-weight:800;line-height:1.35;letter-spacing:-.02em;margin-bottom:22px}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--ac);margin:0 4px;transform:translateY(2px)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--s);border:2px solid var(--line);border-radius:20px;padding:15px 16px;font-size:16.5px;box-shadow:0 2px 0 rgba(15,26,43,.05);font-weight:500;line-height:1.35;transition:border-color .15s,background .15s}
.opt .l{width:34px;height:34px;border-radius:11px;background:var(--s2);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;color:var(--mut)}
.opt .l svg{width:18px;height:18px;stroke-width:3}
.opt .t{flex:1}
button.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--ac);background:var(--acs)}
.opt.sel .l{background:var(--ac);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--oks);animation:pop .3s}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--nos);animation:pop .3s}
.opt.no .l{background:var(--no);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:16px;padding:14px 16px;border-radius:16px;font-size:14.5px;line-height:1.5;background:var(--s2);animation:fade .3s}
.fb b{display:block;margin-bottom:2px;font-size:15px}
.fb.good b{color:var(--ok)}.fb.bad b{color:var(--no)}
.fb em{display:block;color:var(--mut);font-style:normal;margin-top:6px;font-size:13.5px}
.qfoot{display:flex;gap:10px;padding:10px 16px 18px;flex:none}
.qfoot .btn:first-child{width:34%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px;margin:14px 0}
.grid button{height:48px;border-radius:13px;background:var(--s2);font-weight:700;font-size:15px;border:2px solid transparent}
.grid .a{background:var(--acs);color:var(--ac)}
.grid .g{background:var(--oks);color:var(--ok)}
.grid .w{background:var(--nos);color:var(--no)}
.grid .cur{border-color:var(--ink)}
.res{align-items:center;text-align:center;padding:30px 20px 28px}
.ring{position:relative;width:176px;height:176px;margin:6px auto 18px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);stroke-width:11}
.ring circle{fill:none}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--ac);stroke-dasharray:352;stroke-dashoffset:352;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring div{position:absolute;inset:0;display:grid;place-content:center}
.ring b{font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ring span{color:var(--mut);font-size:13px;margin-top:4px}
.res h2{font-size:24px;font-weight:800}
.res .sub{color:var(--mut);margin:6px 0 20px;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin-bottom:20px}
.stat{background:var(--s);border:1px solid var(--line);border-radius:18px;padding:14px 6px}
.stat b{display:block;font-size:22px;font-weight:800}
.stat small{color:var(--mut);font-size:12px}
.stat.ok b{color:var(--ok)}.stat.no b{color:var(--no)}
.stack{display:flex;flex-direction:column;gap:10px;width:100%}
.rv{background:var(--s);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
.rv .qt{font-size:16.5px;margin-bottom:14px}
.rv .num{font-size:12px;font-weight:700;color:var(--mut);margin-bottom:8px;display:flex;justify-content:space-between}
.rv .opt{font-size:15px;padding:10px 12px;cursor:default}
.sticky{position:sticky;top:0;background:var(--bg);z-index:3;padding:14px 16px 10px;display:flex;align-items:center;gap:12px}
.sticky h2{font-size:19px;font-weight:800;flex:1}
.filters{display:flex;gap:8px;padding:0 18px 12px}
.filters button{padding:9px 14px;border-radius:99px;border:1.5px solid var(--line);font-size:13px;font-weight:700;background:var(--s)}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 20px}
.sec{font-size:15px;font-weight:800;margin:20px 2px 10px}
.pb{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}
.pb i{display:block;height:100%;background:var(--ac);border-radius:9px}
.card{background:var(--s);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:10px}
.card .hd{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.card .hd b{font-weight:700}
.card small{color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:14.5px;line-height:1.5}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:30;animation:fade .2s;white-space:nowrap}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes pop{50%{transform:scale(1.02)}}
@media(max-width:380px){.qt{font-size:18px}.opt{font-size:15px}.chead h2{font-size:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const DATA={"npc":[{"name":"Paper 1","title":"GST 112 Second Semester Exam (2023/2024 Session)","questions":[{"n":1,"q":"Which of the following is a Nigerian Citizen by right?","o":["Citizen by Registration.","Citizen by Naturalisation.","Citizen by Birth","All of the Above."],"a":2},{"n":2,"q":"All lawyers (Legal Practitioners) are bound to comply with...","o":["Rules of Professional Conduct (RPC)","Medical and Dental Practitioners Act.","The Constitution of Federal Republic of Nigeria and Code of Conduct Bureau and Tribunal Act.","Code of Medical Ethics."],"a":0},{"n":3,"q":"Government workers are bound to comply with...","o":["Rules of Professional Conduct (RPC)","Code of Medical Ethics 2008","Medical and Dental Practitioners Act 2004","The Constitution of Federal Republic of Nigeria and Code of Conduct Bureau and Tribunal Act"],"a":3},{"n":4,"q":"All of the following are examples of Nigerian Citizens Except:","o":["Citizen by Birth","Citizen by Registration","Citizen by Naturalisation","None of the above"],"a":3},{"n":5,"q":"The following is a good example of pressing challenges facing law enforcement agencies in Nigeria.","o":["All of the below","Corruption","Poor salary","Capacity development"],"a":0},{"n":6,"q":"Law Enforcement agencies perform the following functions except:","o":["Ensuring compliance with the laws of the land","Law making and interpretation of laws","Maintenance of peace, order and stability in Nigeria","Taking steps to bring violators of the law to justice"],"a":1},{"n":7,"q":"All of the following are typical examples of law enforcement agencies in Nigeria except:","o":["Nigeria Police Force (NPF).","Department of State Security (DSS).","Nigeria Immigration Service (NIS).","None of the above."],"a":3},{"n":8,"q":"A Nigerian Citizen can loss his/her citizenship Status as result of...","o":["Renunciation","Deprivation","Forfeiture","All of the above"],"a":3},{"n":9,"q":"The fundamental rights of a Nigerian Citizen could be deprived on the grounds of...","o":["Public Health","National Defence","Protecting the rights of others","All of the above"],"a":3},{"n":10,"q":"By nature, Law being a body of rules is...","o":["Not Dynamic","Not Coercive","Not Territorial","None of the above"],"a":3},{"n":11,"q":"The definition of ethics and law share the following in common, except:","o":["Lack of specific, standard or universal definition","The definition of both is influenced by your profession or discipline","The definition of both depends on your geographical location","All of the above"],"a":2},{"n":12,"q":"According to... law is defined as a set of divine rules.","o":["Lawyers","Theologians","Scientists","Traditionalists"],"a":1},{"n":13,"q":"A judge is under obligation...","o":["Not to preside over matters which he/she has any interest in it","To presume that the accused person before him innocent until proven guilty","To feed the accused person three square meals daily","To give the accused person the chance to defend himself in person or through a legal practitioner of his own choice"],"a":0},{"n":14,"q":"Which of the following is not true about classification of law...","o":["Substantive and Procedural Law","Private and Public Law","Domestic/Municipal and International Law","Supper National Law"],"a":3},{"n":15,"q":"Law may differ from one society to another. This assertion can be exemplified by the following...","o":["Consumption of alcohol and adultery in Kano State","Bigamy in the Southern states of Nigeria","Prostitution in some European Countries","All of the above"],"a":3},{"n":16,"q":"What was the primary purpose of the Nigerian Youth Movement (NYM) formed in the 1930s due to one of these?","o":["Promote regional autonomy","Unite Nigerians across ethnic lines","Support British colonial policies","Advocate for military rule"],"a":1},{"n":17,"q":"... newspaper was founded by Nnamdi Azikiwe to spread nationalist ideas?","o":["The Nigerian Tribune","The West African Pilot","The Daily Times","The Guardi   if(o.type==="paper"){refs=DATA[o.course][o.p].questions.map((_,i)=>[o.p,i]);label=COURSES[o.course].code+" · "+DATA[o.course][o.p].name}
  else if(o.type==="quick"){refs=shuf(allRefs(o.course)).slice(0,o.count);label=COURSES[o.course].code+" · Quick quiz"}
  else{refs=shuf(S.missed[o.course].map(k=>k.split(":").map(Number))).slice(0,50);label=COURSES[o.course].code+" · Missed questions"}
  if(o.shuffle&&o.type==="paper")shuf(refs);
  S.session={course:o.course,mode:o.mode,label,refs,ans:refs.map(()=>null),idx:0,t:0,limit:o.mode==="exam"?Math.ceil(refs.length*.6)*60:0,paper:o.type==="paper"?o.p:null};
  save();go("quiz")}

/* QUIZ */
function opts(q,a,rev,live){return q.o.map((t,i)=>{let c="opt",ic=L[i];
  if(rev){if(i===q.a){c+=" ok";ic=I.ck}else if(i===a){c+=" no";ic=I.no}else c+=" dim"}else if(i===a)c+=" sel";
  return live?`<button class="${c}" data-act="pick" data-i="${i}"><span class="l">${ic}</span><span class="t">${esc(t)}</span></button>`:`<div class="${c}"><span class="l">${ic}</span><span class="t">${esc(t)}</span></div>`}).join("")}
function fb(q,a){const good=a===q.a,none=a==null;
  return `<div class="fb ${good?"good":"bad"}"><b>${good?"Correct":none?"Skipped":"Not quite"}</b>${good?"":`Correct answer: (${L[q.a]}) ${esc(q.o[q.a])}`}${q.e?`<em>${esc(q.e)}</em>`:""}</div>`}
const timeTxt=()=>{const s=S.session;return s.limit?fmt(Math.max(0,s.limit-s.t)):fmt(s.t)};
function quiz(){
  const s=S.session;if(!s)return go("home");
  const q=Q(s.course,s.refs[s.idx]),n=s.refs.length,a=s.ans[s.idx],rev=s.mode==="practice"&&a!=null,done=s.ans.filter(x=>x!=null).length;
  view.innerHTML=`<div data-c="${s.course}" style="display:flex;flex-direction:column;flex:1;min-height:0">
  <div class="qtop"><button class="ib" data-act="exit" aria-label="Save and exit">${I.x}</button><div class="qmeta"><b>${s.idx+1}<span> / ${n}</span></b><small>${esc(s.label)}</small></div><div class="timer${s.limit&&s.limit-s.t<=60?" low":""}" id="tm">${timeTxt()}</div><button class="ib" data-act="nav" aria-label="All questions">${I.grid}</button></div>
  <div class="bar"><i style="width:${done/n*100}%"></i></div>
  <div class="qbody" id="qb"><h2 class="qt">${fq(q.q)}</h2><div class="opts">${opts(q,a,rev,!rev)}</div>${rev?fb(q,a):""}</div>
  <div class="qfoot"><button class="btn ghost" data-act="prev" ${s.idx?"":"disabled"}>Back</button><button class="btn pri" data-act="next">${s.idx===n-1?"Finish":"Next"}</button></div></div>`;
  clearInterval(tick);tick=setInterval(()=>{s.t++;const e=$("#tm");if(e){e.textContent=timeTxt();e.classList.toggle("low",!!s.limit&&s.limit-s.t<=60)}if(s.t%5===0)save();if(s.limit&&s.t>=s.limit){toast("Time is up");finish()}},1000);
  if(rev)setTimeout(()=>{const f=$(".fb");if(f)f.scrollIntoView({block:"nearest",behavior:"smooth"})},50)}
function pick(i){const s=S.session;if(s.mode==="practice"&&s.ans[s.idx]!=null)return;s.ans[s.idx]=i;save();quiz()}
function step(d){const s=S.session,n=s.refs.length,j=s.idx+d;if(j<0)return;if(j>=n)return confirmFinish();s.idx=j;save();quiz()}
function navSheet(){const s=S.session,done=s.ans.filter(x=>x!=null).length;
  const cells=s.refs.map((r,i)=>{const a=s.ans[i];let c="";if(a!=null)c=s.mode==="practice"?(a===Q(s.course,r).a?"g":"w"):"a";return `<button class="${c}${i===s.idx?" cur":""}" data-act="jump" data-i="${i}">${i+1}</button>`}).join("");
  sheet(`<div data-c="${s.course}"><h3>Questions</h3><p class="sub">${done} of ${s.refs.length} answered</p><div class="grid">${cells}</div><button class="btn pri" data-act="finish">${s.mode==="exam"?"Submit exam":"Finish quiz"}</button></div>`)}
function confirmFinish(){const s=S.session,u=s.ans.filter(x=>x==null).length;
  if(!u)return finish();
  sheet(`<div data-c="${s.course}"><h3>Finish now?</h3><p class="sub">You have ${u} unanswered question${u>1?"s":""}. Unanswered questions count as wrong.</p><div class="stack"><button class="btn pri" data-act="finish-now">Finish and see score</button><button class="btn ghost" data-act="close">Keep going</button></div></div>`)}
function finish(){
  const s=S.session;if(!s)return;clearInterval(tick);
  let ok=0;const m=new Set(S.missed[s.course]);
  s.refs.forEach((r,i)=>{const a=s.ans[i],k=r[0]+":"+r[1];if(a===Q(s.course,r).a){ok++;m.delete(k)}else if(a!=null)m.add(k)});
  S.missed[s.course]=[...m];
  const n=s.refs.length,pct=Math.round(ok/n*100);
  last=Object.assign({},s,{ok,pct,n});
  S.hist.unshift({ts:Date.now(),course:s.course,label:s.label,mode:s.mode,pct,ok,n,t:s.t});S.hist=S.hist.slice(0,40);
  if(s.paper!=null){const k=s.course+":"+s.paper;if(S.best[k]==null||pct>S.best[k])S.best[k]=pct}
  S.session=null;save();go("res")}

/* RESULT + REVIEW */
function res(){
  const r=last;if(!r)return go("home");
  const wrong=r.refs.filter((x,i)=>r.ans[i]!=null&&r.ans[i]!==Q(r.course,x).a).length,skip=r.ans.filter(x=>x==null).length;
  const msg=r.pct>=80?"Excellent work":r.pct>=60?"Good progress":r.pct>=40?"Keep practising":"Review and try again";
  view.innerHTML=`<div class="pad res" data-c="${r.course}"><div class="ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="56"/><circle class="fg" id="fg" cx="60" cy="60" r="56" stroke-linecap="round"/></svg><div><b>${r.pct}%</b><span>${r.ok} of ${r.n}</span></div></div>
  <h2>${msg}</h2><p class="sub">${esc(r.label)}</p>
  <div class="stats"><div class="stat ok"><b>${r.ok}</b><small>Correct</small></div><div class="stat no"><b>${wrong+skip}</b><small>${skip?"Wrong or skipped":"Wrong"}</small></div><div class="stat"><b>${fmt(r.t)}</b><small>Time</small></div></div>
  <div class="stack"><button class="btn pri" data-act="review">Review answers</button>${wrong+skip?'<button class="btn ghost" data-act="retrywrong">Retry wrong answers</button>':""}<button class="btn ghost" data-act="home">Back to home</button></div></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const f=$("#fg");if(f)f.style.strokeDashoffset=352*(1-r.pct/100)}))}
function rev(){
  const r=last,st=i=>r.ans[i]==null?"skip":r.ans[i]===Q(r.course,r.refs[i]).a?"ok":"no";
  let h=`<div data-c="${r.course}"><div class="sticky"><button class="ib" data-act="backres" aria-label="Back">${I.x}</button><h2>Review answers</h2></div><div class="filters">${[["all","All"],["no","Wrong"],["skip","Skipped"],["ok","Correct"]].map(f=>`<button data-act="filt" data-f="${f[0]}" class="${filt===f[0]?"on":""}">${f[1]}</button>`).join("")}</div><div class="pad" style="padding-top:4px">`;
  let c=0;r.refs.forEach((x,i)=>{if(filt!=="all"&&st(i)!==filt)return;c++;const q=Q(r.course,x),a=r.ans[i];
    h+=`<article class="rv"><div class="num"><span>Question ${i+1}</span><span style="color:var(--${st(i)==="ok"?"ok":st(i)==="no"?"no":"mut"})">${st(i)==="ok"?"Correct":st(i)==="no"?"Wrong":"Skipped"}</span></div><h3 class="qt">${fq(q.q)}</h3><div class="opts">${opts(q,a,true,false)}</div>${q.e?`<div class="fb"><em style="margin:0">${esc(q.e)}</em></div>`:""}</article>`});
  view.innerHTML=h+(c?"":'<p class="empty">No questions in this filter.</p>')+"</div></div>"}

/* PROGRESS */
function prog(){
  const H=S.hist,n=H.length,avg=n?Math.round(H.reduce((a,b)=>a+b.pct,0)/n):0,qs=H.reduce((a,b)=>a+b.n,0);
  let h=`<header class="top"><div><h1>Progress</h1><p>Your results on this device</p></div></header><div class="pad"><div class="tiles"><div class="stat"><b>${n}</b><small>Quizzes</small></div><div class="stat"><b>${n?avg+"%":"–"}</b><small>Average</small></div><div class="stat"><b>${qs}</b><small>Answered</small></div></div>`;
  for(const c in COURSES){h+=`<div class="sec">${COURSES[c].name}</div>`;
    DATA[c].forEach((p,i)=>{const b=S.best[c+":"+i];h+=`<div class="card" data-c="${c}"><div class="hd"><b>${p.name}</b><small>${b!=null?"Best "+b+"%":"Not attempted"}</small></div><div class="pb"><i style="width:${b||0}%"></i></div></div>`});
    const m=S.missed[c].length;if(m)h+=`<button class="btn ghost" data-act="missed" data-c="${c}" style="margin-bottom:10px">Retry ${m} missed question${m>1?"s":""}</button>`}
  h+='<div class="sec">Recent quizzes</div>';
  h+=n?H.slice(0,12).map(x=>`<div class="card" data-c="${x.course}"><div class="hd"><b>${esc(x.label)}</b><b class="chip">${x.pct}%</b></div><small>${x.ok}/${x.n} · ${x.mode==="exam"?"Timed exam":"Practice"} · ${new Date(x.ts).toLocaleDateString(undefined,{day:"numeric",month:"short"})}</small></div>`).join(""):'<p class="empty">No quizzes yet. Pick a paper on the Home tab to begin.</p>';
  if(n)h+='<button class="btn danger" data-act="reset" style="margin-top:14px">Clear my progress</button>';
  view.innerHTML=h+"</div>"}

/* EVENTS */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,d=b.dataset;
  switch(a){
    case"tab":go(d.v);break;
    case"theme":S.theme=(document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))==="dark"?"light":"dark";theme();save();break;
    case"resume":go("quiz");break;
    case"paper":openStart({type:"paper",course:d.c,p:+d.p});break;
    case"quick":openStart({type:"quick",course:d.c});break;
    case"missed":openStart({type:"missed",course:d.c});break;
    case"mode":cfg.mode=d.m;drawStart();break;
    case"count":cfg.count=+d.k;drawStart();break;
    case"shuf":cfg.shuffle=!cfg.shuffle;drawStart();break;
    case"begin":begin();break;
    case"pick":pick(+d.i);break;
    case"next":step(1);break;
    case"prev":step(-1);break;
    case"nav":navSheet();break;
    case"jump":S.session.idx=+d.i;save();quiz();closeSheet();break;
    case"close":closeSheet();break;
    case"finish":closeSheet();confirmFinish();break;
    case"finish-now":finish();break;
    case"exit":save();toast("Progress saved");go("home");break;
    case"review":filt="all";go("rev");break;
    case"filt":filt=d.f;rev();break;
    case"backres":go("res");break;
    case"home":go("home");break;
    case"retrywrong":{const r=last,refs=r.refs.filter((x,i)=>r.ans[i]!==Q(r.course,x).a);
      S.session={course:r.course,mode:"practice",label:COURSES[r.course].code+" · Retry wrong",refs:shuf(refs),ans:refs.map(()=>null),idx:0,t:0,limit:0,paper:null};save();go("quiz");break}
    case"reset":sheet('<h3>Clear progress?</h3><p class="sub">This removes your scores, history and missed questions from this device.</p><div class="stack"><button class="btn danger" data-act="reset-ok">Clear everything</button><button class="btn ghost" data-act="close">Cancel</button></div>');break;
    case"reset-ok":S.hist=[];S.best={};S.missed={npc:[],phil:[]};S.session=null;save();go("prog");toast("Progress cleared");break}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")return closeSheet();
  if(V!=="quiz"||$("#sh")||!S.session)return;
  const k=e.key.toLowerCase(),i="abcd".indexOf(k);
  if(i>-1)pick(i);else if(k>="1"&&k<="4")pick(+k-1);
  else if(k==="arrowright"||k==="enter")step(1);else if(k==="arrowleft")step(-1)});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&S.session)save()});
theme();go("home");
</script>
</body>
</html>
